<div id="example" inline="
    |&greeting:Hello World
    |$outputDiv:!greeting
    |%shout:[!greeting]
"></div>
<div id="outputDiv"></div>

<button id="run" turn="example">Show Greeting</button>

<script src="./inline/dotpipe.js"></script>

<script>
function shout(text) {
    console.log('Shout:', text.toUpperCase());
    return text;
}

</script>
