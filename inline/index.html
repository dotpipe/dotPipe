<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>dotPipe Call Demo</title>
  <script src="./inline/dotpipe.js"></script>
  <script>
    // ========================
    // Custom page functions
    // ========================
    function highlight(elem) {
      elem.style.background = "yellow";
      elem.textContent = "✨ Highlighted!";
    }

    function saveData(id, value) {
      const target = document.getElementById(id);
      if (target) {
        target.textContent = "Saved value: " + value;
      }
    }

    function processValue(v) {
      alert("Processed value → " + v);
    }
  </script>
</head>
<body>
<div id="crazyStrawOutput"></div>
<button inline="
  |+crazyStrawOutput:timer1
  |modala:./inline/data.json:crazyStrawOutput
  |&n:testing
  |log:!n
  |-timer1
">Run Modala</button>

  <!-- Call a global fn with the element itself -->
  <button inline="|call:highlight:this">Highlight Me</button>

  <!-- Store into var, then pass into a function -->
  <button inline="|&n:42 |call:processValue:!n">Process 42</button>

  <!-- Save text into #crazyStrawOutput -->
  <button inline="|call:saveData:crazyStrawOutput:Done!">Save Output</button>

</body>
</html>
