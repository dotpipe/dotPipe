<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dotPipe JSON Tree</title>
    <script src="dotPipe.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            padding: 20px;
        }

        .tree-item {
            margin-left: 20px;
            cursor: pointer;
        }

        .highlight {
            background-color: #444;
            border-radius: 5px;
            padding: 2px;
        }

        .sub-tree {
            display: none;
            margin-left: 20px;
        }
    </style>
</head>

<body>
    <h1>JSON Directory Tree</h1>
    <div id="jsonTree"></div>

    <script>
        const jsonData = {
            "label": "Root",
            "table": {
                "label": "Table",
                "sales": {
                    "textContent": "Sales",
                    "td2": {
                        "ajax": "./tree.json",
                        "class": "sale-label tree-view",
                        "id": "sales-tag",
                        "insert": "sales-tag",
                        "textContent": "On Sale!",
                        "style": "color: #406;"
                    },
                    "sale1": {
                        "textContent": "Sale 1",
                        "ajax": "index2.html",
                        "tagname": "td",
                        "class": "sale-label redirect",
                        "id": "sales-tag1",
                        "textContent": "On Sale!!!",
                        "style": "color: #406;"
                    }
                }
            }
        };
        renderTree(jsonData, "jsonTree");
    </script>

</body>

</html>
