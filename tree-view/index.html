<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>domPipe JSON Tree</title>
    <script src="../domPipe.js"></script>
    <style>
        .modal-tip-box {
            background: #fff;
            color: #222;
            padding: 8px 10px;
            border-radius: 6px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
            border: 1px solid #ddd;
            max-width: 260px;
            font-size: 13px;
            animation: fadeUpshow 0.18s ease-out;
        }

        @keyframes fadeUpshow {
            from {
                opacity: 0;
                transform: translateY(3px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Optional arrow */
        .modal-tip-box::before {
            content: "";
            position: absolute;
            left: -6px;
            top: 10px;
            border-width: 6px;
            border-style: solid;
            border-color: transparent #fff transparent transparent;
            filter: drop-shadow(1px 1px 1px rgba(0, 0, 0, 0.1));
        }

        /* Base tree item */
        .tree-item {
            display: flex;
            align-items: center;
            position: relative;
            padding: 4px 6px;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            color: #222;
            cursor: pointer;
            user-select: none;
            line-height: 1.2;
            border-radius: 4px;
            --indent: 18px;
        }

        /* Icon styling */
        .tree-item .tree-icon {
            width: 16px;
            height: 16px;
            margin-right: 6px;
            object-fit: contain;
        }

        /* Hover highlight */
        .tree-item:hover {
            background: rgba(80, 120, 255, 0.10);
        }

        /* Selected item */
        .tree-item.highlight {
            background: rgba(80, 120, 255, 0.25);
            color: #000;
            font-weight: 600;
            border-left: 3px solid rgba(60, 100, 255, 0.8);
        }

        /* CHILDREN BLOCK */
        .sub-tree {
            margin-left: var(--indent);
            padding-left: 10px;
            border-left: 1px solid #ddd;
            animation: fadeInTree 0.25s ease-out;
        }

        /* Fade in */
        @keyframes fadeInTree {
            from {
                opacity: 0;
                transform: translateY(-2px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tree branches / connectors */
        .tree-item::before {
            content: '';
            position: absolute;
            left: calc(-1 * var(--indent) + 8px);
            top: 50%;
            width: var(--indent);
            height: 1px;
            background: #ddd;
        }

        .tree-item:first-child::before {
            top: 14px;
        }

        .tree-item:last-child::after {
            content: '';
            position: absolute;
            left: calc(-1 * var(--indent) + 8px);
            top: 14px;
            width: 1px;
            height: calc(100% - 14px);
            background: #fff;
            /* mask branch for last child */
        }

        /* Remove lines at the very root */
        .tree-root>.tree-item::before,
        .tree-root>.tree-item::after {
            display: none !important;
        }
    </style>
</head>

<body>
    <h1>JSON Directory Tree</h1>
    <div id="jsonTree"></div>

    <script>
        const jsonData = {
            label: "Products",
            //icon: "icons/folder.svg",
            children: [
                {
                    label: "Books",
                    //icon: "icons/folder.svg",
                    children: [
                        { label: "Fiction" },
                        { label: "Non-fiction" }
                    ]
                },
                {
                    tagname: "div",
                    label: "Electronics",
                    //icon: "icons/folder.svg",
                    id: "serve",
                    class: "mouse modala",
                    event: "click",
                    modaltip: "../tree-view/electronics.json:treeTip:2000:9999",
                    children: [
                        { label: "Laptops" },
                        { label: "Smartphones" },
                        { label: "Cameras" },
                        { tagname: "div", label: "More", style: "width:auto;height:auto;padding:15px;", id: "treeTip" }
                    ]
                }
            ]
        };

        renderTree(jsonData, "jsonTree");
    </script>

</body>

</html>
