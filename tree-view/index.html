<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dotPipe JSON Tree</title>
    <script src="./dotpipe.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            padding: 20px;
        }

        .tree-item {
            margin-left: 20px;
            cursor: pointer;
        }

        .highlight {
            background-color: #444;
            border-radius: 5px;
            padding: 2px;
        }

        .sub-tree {
            display: none;
            margin-left: 20px;
        }
    </style>
</head>

<body>
    <h1>JSON Directory Tree</h1>
    <div id="jsonTree"></div>

    <script>
        const jsonData = {
            "label": "Root",
            "table": {
                "label": "Table",
                "sales": {
                    "textContent": "Sales",
                    "td2": {
                        "ajax": "./tree.json;sales-tag",
                        "tagname": "td",
                        "icon": "apes.jpg",
                        "class": "sale-label tree-view",
                        "id": "sales-tag",
                        "textContent": "On Sale!",
                        "style": "color: #406;"
                    },
                    "sale1": {
                        "tagname": "td",
                        "class": "sale-label mouse",
                        "id": "sales-tag1",
                        "modal-tip": "tree.json;sales-tag1;tree-item;2000;100",
                        "textContent": "On Sale!!!",
                        "style": "color: #406;"
                    },
                    "sale2": {
                        "tagname": "td",
                        "class": "sale-label mouse test-callback",
                        "id": "sales-tag1",
                        "textContent": "NEW ARRIVAL!!!",
                        "style": "color: #406;",
                        "name": "test2",
                        "value": "test1"
                    },
                    "sale3": {
                        "tagname": "td",
                        "class": "sale-label mouse test-callback",
                        "id": "sales-tag1",
                        "callback": "test",
                        "callback-class": "test-callback",
                        "textContent": "NEW DEAL!!!",
                        "style": "color: #406;",
                        "name": "test1",
                        "value": "test2"
                    }
                }
            }
        };
        renderTree(jsonData, "jsonTree");
    </script>

</body>

</html>
