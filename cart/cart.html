<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart Example</title>
  <link rel="stylesheet" href="styles.css">
  <script src="../domPipe.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2em;
      background: #f9f9f9;
      color: #222;
    }

    h1 {
      font-size: 1.8em;
      margin-bottom: 0.5em;
    }

    a {
      color: #0078d7;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      background: #0078d7;
      color: white;
      border: none;
      padding: 0.5em 1em;
      margin: 0.3em 0;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1em;
    }

    button:hover {
      background: #005fa3;
    }

    .cart,
    cart {
      display: flex;
      flex-direction: column;
      gap: 1em;
    }

    .cart-card {
      background: #fff;
      border: 1px solid #000;
      border-radius: 4px;
      padding: 1em;
      display: flex;
      flex-direction: column;
    }

    .cart-card h2 {
      font-size: 1.2em;
      margin: 0 0 0.5em;
      border-bottom: 1px solid #000;
      padding-bottom: 0.3em;
    }

    .cart-card p {
      margin: 0.3em 0;
      line-height: 1.4;
    }

    .cart-card button {
      align-self: flex-start;
      margin-top: 0.5em;
      background: #0078d7;
      color: #fff;
      border: none;
      padding: 0.4em 0.8em;
      border-radius: 3px;
      cursor: pointer;
    }

    .cart-card button:hover {
      background: #005fa3;
    }

    .checkout-card {
      background: #fff;
      border: 1px solid #000;
      border-radius: 4px;
      padding: 1em;
      margin-top: 1em;
    }

    .checkout-card h2 {
      font-size: 1.2em;
      margin: 0 0 0.5em;
      border-bottom: 1px solid #000;
      padding-bottom: 0.3em;
    }

    .checkout-card label {
      display: block;
      margin: 0.5em 0;
    }

    .checkout-card input {
      width: 100%;
      padding: 0.4em;
      border: 1px solid #000;
      border-radius: 3px;
    }

    item {
      display: block;
      margin: 0.5em 0;
      padding: 0.5em;
      border-bottom: 1px solid #eee;
    }

    item:last-child {
      border-bottom: none;
    }

    .checkout,
    checkout {
      display: inline-block;
      margin-top: 1em;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="password"] {
      padding: 0.5em;
      margin: 0.3em 0;
      width: 100%;
      max-width: 400px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1em;
    }

    form label {
      display: block;
      margin-top: 1em;
    }

    svg {
      display: block;
      margin: 1em 0;
      border: 1px solid #ccc;
      background: #fff;
    }
  </style>
</head>

<body>

  <h1>Your Cart</h1>

  <cart id="mainCart" bind="CartController"></cart>

  <p>Total: $<span id="total">0.00</span></p>

  <button id="checkoutBtn">Go to checkout</button>
  <button id="clearBtn">Clear cart</button>
  <script>
    const CART_KEY = "../domPipe.cart";

    const CartController = {
      init(cartEl) {
        const saved = JSON.parse(localStorage.getItem(CART_KEY) || "{}");
        (saved.items || []).forEach(it => {
          const itemEl = document.createElement("item");
          itemEl.setAttribute("name", it.name);
          itemEl.setAttribute("price", String(it.price));
          itemEl.setAttribute("quantity", String(it.quantity));
          cartEl.appendChild(itemEl);
        });
        updateCartTotal(cartEl);
        render(cartEl);
      },
      onRemove(cartEl, e) {
        const targetName = e.detail && e.detail.name;
        if (!targetName) return;
        cartEl.querySelectorAll("item").forEach(it => {
          if (it.getAttribute("name") === targetName) it.remove();
        });
        updateCartTotal(cartEl); persist(cartEl); render(cartEl);
      }
    };

    function updateCartTotal(cartEl) {
      let total = 0;
      cartEl.querySelectorAll("item").forEach(it => {
        const p = parseFloat(it.getAttribute("price") || "0");
        const q = parseInt(it.getAttribute("quantity") || "0", 10);
        total += p * q;
      });
      cartEl.dataset.total = total.toFixed(2);
      document.getElementById("total").textContent = cartEl.dataset.total;
    }

    function persist(cartEl) {
      const items = Array.from(cartEl.querySelectorAll("item")).map(it => ({
        name: it.getAttribute("name"),
        price: parseFloat(it.getAttribute("price") || "0"),
        quantity: parseInt(it.getAttribute("quantity") || "0", 10)
      }));
      localStorage.setItem(CART_KEY, JSON.stringify({ items, total: cartEl.dataset.total }));
    }

    function render(cartEl) {
      // Render simple list with remove buttons
      const container = document.getElementById("list") || document.body.appendChild(Object.assign(document.createElement("div"), { id: "list" }));
      container.innerHTML = "";
      cartEl.querySelectorAll("item").forEach(it => {
        const row = document.createElement("div");
        row.textContent = `${it.getAttribute("name")} — $${parseFloat(it.getAttribute("price")).toFixed(2)} x ${it.getAttribute("quantity")} `;
        const btn = document.createElement("button");
        btn.textContent = "Remove";
        btn.addEventListener("click", () => {
          cartEl.dispatchEvent(new CustomEvent("remove", { detail: { name: it.getAttribute("name") } }));
        });
        row.appendChild(btn);
        container.appendChild(row);
      });
    }

    const binder = new DomPipeBinder();
    binder.register("CartController", CartController);
    document.addEventListener("DOMContentLoaded", () => { binder.init(); binder.observe(); });

    document.getElementById("checkoutBtn").addEventListener("click", () => location.href = "checkout.html");
    document.getElementById("clearBtn").addEventListener("click", () => {
      localStorage.removeItem(CART_KEY);
      const cartEl = document.getElementById("mainCart");
      cartEl.innerHTML = "";
      updateCartTotal(cartEl);
      render(cartEl);
    });
  </script>

</body>

</html>
