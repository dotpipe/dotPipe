<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart Example</title>
  <link rel="stylesheet" href="styles.css">
  <script src="../dotpipe.js"></script>
  <script src="cart-component.js"></script>
  <script src="checkout-component.js"></script>
  <script src="order-confirmation-component.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>Your Online Store</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span id="cart-count">0</span></a>
      </nav>
    </div>
  </header>
  
  <main class="container">
    <!-- Product listing example -->
    <div class="products-container">
      <h2>Featured Products</h2>
      <div class="product-grid">
        <!-- Product 1 -->
        <div class="product-card">
          <img src="product1.jpg" alt="Product 1">
          <h3>Product 1</h3>
          <p class="price">$19.99</p>
          <item id="product1" name="Product 1" price="19.99" image="product1.jpg"></item>
        </div>
        
        <!-- Product 2 -->
        <div class="product-card">
          <img src="product2.jpg" alt="Product 2">
          <h3>Product 2</h3>
          <p class="price">$29.99</p>
          <item id="product2" name="Product 2" price="29.99" image="product2.jpg"></item>
        </div>
        
        <!-- Product 3 with AJAX loading -->
        <div class="product-card">
          <img src="product3.jpg" alt="Product 3">
          <h3>Product 3</h3>
          <p class="price">$39.99</p>
          <item id="product3" ajax="items.php:_self:1;"></item>
        </div>
      </div>
    </div>
    
    <!-- Shopping cart example -->
    <cart id="siteCart">
      <!-- Items will be dynamically added here -->
    </cart>
    
    <!-- Checkout example (on checkout page) -->
    <!-- <checkout validate="true"></checkout> -->
    
    <!-- Order confirmation example (on confirmation page) -->
    <!-- <order-confirmation></order-confirmation> -->
  </main>
  
  <footer>
    <div class="container">
      <p>© 2025 Your Store. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
