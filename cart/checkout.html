            border-radius: 4px;

        .cart,
        cart {
            display: block;
            border: 1px solid #ccc;
            background: #fff;
            padding: 1em;
            margin-bottom: 1em;
            border-radius: 6px;
        }

        item {
            display: block;
            margin: 0.5em 0;
            padding: 0.5em;

        item:last-child {

        input[type="password"] {

            font-size: 1em;
        }

        form label {
            display: block;
            margin-top: 1em;
        }

        svg {
            display: block;
            margin: 1em 0;
            border: 1px solid #ccc;
            background: #fff;
        }
    </style>
</head>
<body>

  <h1>Checkout</h1>

  <cart id="checkoutCart" bind="CartController"></cart>
  <p>Total: $<span id="total">0.00</span></p>

  <form id="checkoutForm">
    <label>Name <input name="name" required></label><br>
    <label>Email <input type="email" name="email" required></label><br>
    <label>Address <input name="address" required></label><br>
    <label>Card <input name="card" required></label><br>
    <button type="submit">Place order</button>
  </form>

  <script src="../dotpipe.js"></script>

    const CART_KEY="../dotpipe.cart";

    const CartController = {
      init(cartEl){
        const saved=JSON.parse(localStorage.getItem(CART_KEY)||"{}");
        (saved.items||[]).forEach(it=>{
          const itemEl=document.createElement("item");
          itemEl.setAttribute("name", it.name);
          itemEl.setAttribute("price", String(it.price));
          itemEl.setAttribute("quantity", String(it.quantity));
          cartEl.appendChild(itemEl);
        });
        updateCartTotal(cartEl);
      }
    };

    function updateCartTotal(cartEl){
      let total=0;
      cartEl.querySelectorAll("item").forEach(it=>{
        const p=parseFloat(it.getAttribute("price")||"0");
        const q=parseInt(it.getAttribute("quantity")||"0",10);
        total+=p*q;
      });
      cartEl.dataset.total=total.toFixed(2);
      document.getElementById("total").textContent = cartEl.dataset.total;
    }

    const binder=new DotPipeBinder();
    binder.register("CartController", CartController);
    document.addEventListener("DOMContentLoaded", ()=>{ binder.init(); binder.observe(); });

    document.getElementById("checkoutForm").addEventListener("submit", (e)=>{
      e.preventDefault();
      const data=Object.fromEntries(new FormData(e.target).entries());
      const order = {
        cart: JSON.parse(localStorage.getItem(CART_KEY)||"{}"),
        customer: data,
        timestamp: new Date().toISOString()
      };
      // Simulate success
      alert("Order placed. Thank you!");
      localStorage.removeItem(CART_KEY);
      location.href = "products.html";
    });
  </script>
