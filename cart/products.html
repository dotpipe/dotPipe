<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2em;
            background: #f9f9f9;
            color: #222;
        }

        h1 {
            font-size: 1.8em;
            margin-bottom: 0.5em;
        }

        a {
            color: #0078d7;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            background: #0078d7;
            color: white;
            border: none;
            padding: 0.5em 1em;
            margin: 0.3em 0;
            cursor: pointer;
            border-radius: 4px;
            font-size: 1em;
        }

        button:hover {
            background: #005fa3;
        }

        .cart,
        cart {
            display: block;
            border: 1px solid #ccc;
            background: #fff;
            padding: 1em;
            margin-bottom: 1em;
            border-radius: 6px;
        }

        item {
            display: block;
            margin: 0.5em 0;
            padding: 0.5em;
            border-bottom: 1px solid #eee;
        }

        item:last-child {
            border-bottom: none;
        }

        .checkout,
        checkout {
            display: inline-block;
            margin-top: 1em;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="password"] {
            padding: 0.5em;
            margin: 0.3em 0;
            width: 100%;
            max-width: 400px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }

        form label {
            display: block;
            margin-top: 1em;
        }

        svg {
            display: block;
            margin: 1em 0;
            border: 1px solid #ccc;
            background: #fff;
        }
    </style>
</head>

<body>

    <h1>Products</h1>

    <div id="product-list"></div>
    <script src="../dotpipe.js"></script>
    <script>
        // Minimal product dataset
        const PRODUCTS = [
            { id: "gtr-001", name: "Electric Guitar", price: 499.99 },
            { id: "amp-002", name: "Amplifier", price: 299.99 },
            { id: "ped-003", name: "Effects Pedal", price: 89.99 },
            { id: "cab-004", name: "Speaker Cabinet", price: 249.00 }
        ];

        // Render products
        const list = document.getElementById("product-list");
        PRODUCTS.forEach(p => {
            const row = document.createElement("div");
            row.textContent = `${p.name} — $${p.price.toFixed(2)} `;
            const view = document.createElement("a");
            view.href = `product.html?id=${encodeURIComponent(p.id)}`;
            view.textContent = "[View]";
            row.appendChild(view);
            list.appendChild(row);
        });
    </script>

</body>

</html>
